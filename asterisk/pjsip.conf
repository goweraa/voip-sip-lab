; Lab PBX: two phones (1001 alice, 1002 bob), one unauthenticated test
; endpoint for SIPp (identified by IP) and one "carrier" trunk pointing at
; an address where nothing listens.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- shared settings -------------------------------------------------------
[phone](!)
type=endpoint
context=lab
disallow=all
allow=ulaw              ; G.711 u-law only, so other codecs get 488
direct_media=no         ; all media is anchored on Asterisk
rtp_symmetric=no        ; trust the SDP address (lets NAT faults show up)
force_rport=yes
rewrite_contact=no

[aor-tpl](!)
type=aor
max_contacts=1
remove_existing=yes

[auth-tpl](!)
type=auth
auth_type=userpass

; ---- alice -----------------------------------------------------------------
[1001](phone)
auth=1001-auth
aors=1001
callerid="Alice" <1001>
[1001-auth](auth-tpl)
username=1001
password=alice-lab-pw
[1001](aor-tpl)

; ---- bob -------------------------------------------------------------------
[1002](phone)
auth=1002-auth
aors=1002
callerid="Bob" <1002>
[1002-auth](auth-tpl)
username=1002
password=bob-lab-pw
[1002](aor-tpl)

; ---- SIPp test generator, trusted by source IP (no auth) -------------------
[sipp](phone)
aors=sipp
[sipp]
type=aor
[sipp-identify]
type=identify
endpoint=sipp
match=10.50.0.30

; ---- dead carrier trunk ----------------------------------------------------
[deadtrunk](phone)
aors=deadtrunk
[deadtrunk]
type=aor
contact=sip:10.50.0.99:5060
