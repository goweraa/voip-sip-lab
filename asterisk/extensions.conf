[lab]
; phones. Stock Asterisk answers 404 when the phone is not registered;
; map that to 480 Temporarily Unavailable like most PBXs and carriers do.
exten => _100X,1,Dial(PJSIP/${EXTEN},20)
 same => n,ExecIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?Hangup(20))
 same => n,Hangup()

; echo test: whatever you send comes back
exten => 600,1,Answer()
 same => n,Echo()

; outbound "PSTN" numbers go to a carrier that is down. When no trunk can
; take the call, return 503 Service Unavailable (cause 34) like a real SBC.
exten => _8XXX,1,Dial(PJSIP/${EXTEN}@deadtrunk,10)
 same => n,ExecIf($["${DIALSTATUS}" != "ANSWER"]?Hangup(34))

; anything else has no match, so Asterisk answers 404 Not Found
